factor_id: mom_12_1
name: 12-month momentum, skipping the most recent month
category: momentum
published_anomaly_eligibility:
  claim_id: published_anomaly_survival_v1
  status: INCLUDED
  reason: Verified MOM2-12 definition origin; common holding protocol is disclosed as a variant.

economic_rationale: >
  Investors underreact to news, and information diffuses through the market
  gradually rather than instantly, so past winners continue to outperform over
  intermediate horizons. The most recent month is skipped because short-horizon
  reversal is a distinct and opposite effect driven by microstructure and
  liquidity provision; including it contaminates the momentum signal with a
  mechanism that works the other way.

persistence_conditions: >
  Expected to weaken in high-volatility regimes and to reverse sharply after
  market crashes, when the losers that rebound most violently are precisely the
  short leg. Expected to decay after publication if the effect is behavioural
  rather than compensation for a risk that investors genuinely bear.

definition: >
  P(s-1) / P(s-12) - 1 at the signal month end s: lags 2-12, eleven monthly
  returns, skipping the most recent month s. s-k is the k-th calendar month end
  before s, and P(m) is the last adjusted close on or before m, carried at most
  ten days. Computed after the close on the last trading day of the formation
  month; the value at s does not depend on which other dates are requested.

timing:
  signal_computed: month_end_close
  earliest_execution: next_trading_day_close
  execution_price: adjusted_close
  data_lag_days: 0
documented_variants:
  - dimension: holding_protocol
    published_definition: Paper-specific portfolio formation, weighting, and holding rules.
    implementation: Common monthly PIT cross-sectional protocol and 21-session forward label.
    consequence: The signal definition is matched but the full paper portfolio is not replicated.

falsification:
  - Decile portfolio returns show no monotonic pattern
  - The effect is concentrated in a single sub-period rather than spread across decades
  - The effect disappears once the portfolio is neutralised on industry
  - Performance at execution lag 1 is indistinguishable from zero

references:
  - citation: "Asness, Moskowitz and Pedersen (2013), Value and Momentum Everywhere, JF"
    role: definition_origin
    locator: "Data section: cumulative return over months 2 through 12 (MOM2-12)."
    verification: VERIFIED
  - citation: "Jegadeesh and Titman (1993), Returns to Buying Winners and Selling Losers, JF"
    role: robustness
    locator: "Formation and holding-period strategy grid."
    verification: VERIFIED
