name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: minimum-supported
            python-version: "3.10"
            constraints: requirements/minimum.txt
          - environment: research-lock
            python-version: "3.12"
            constraints: src/fza/research-requirements.lock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install ${{ matrix.environment }} environment
        run: pip install -c "${{ matrix.constraints }}" -e ".[dev]" build
      - name: lint
        run: ruff check src tests
      # The suite runs on fixtures, so CI needs no credentials and no network
      # beyond PyPI. The point-in-time guarantee is verified here, not asserted.
      - name: unit tests
        run: python -m pytest
      # The demo runs in fixture mode here, which exercises the whole pipeline
      # end to end. A regression the unit tests miss still fails the build.
      - name: demo smoke test
        run: python -m fza.demo --outdir /tmp/demo_out
      # Editable installs can borrow SQL/YAML from the checkout and therefore
      # cannot prove the release artifact is complete. Incident 16 requires the
      # actual wheel to work with no repository beside it.
      - name: wheel clean-install PIT smoke test
        run: |
          python -m build --wheel
          python -m venv /tmp/fza-wheel-smoke
          /tmp/fza-wheel-smoke/bin/pip install -c "${{ matrix.constraints }}" dist/*.whl
          /tmp/fza-wheel-smoke/bin/python -I - <<'PY'
          from fza.factors.registry import load_all, published_anomaly_denominator
          from fza.provenance import research_environment
          from fza.store import Store

          with Store(":memory:") as store:
              assert store.fundamentals_asof("2020-01-01").empty
          assert len(load_all()) == 10
          denominator = published_anomaly_denominator()
          assert denominator["current_n"] == len(denominator["current_included"])
          environment = research_environment()
          assert len(environment["lock_sha256"]) == 64
          assert environment["lock_status"] == (
              "MISMATCH" if environment["lock_mismatches"] else "MATCHED"
          )
          PY
